name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent dependencies
        working-directory: agent
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check agent/sweep.mjs
          node --check agent/lib/territory.mjs
          node --check agent/config/territories.mjs
          node --check agent/classify.mjs
          node --check agent/discover.mjs
          node --check agent/research-weekly-leads.mjs
          node --check agent/export-weekly-leads.mjs
          node --check agent/inquiry-received.mjs
          node --check agent/email-received.mjs
          node --check agent/execute-approved.mjs
          node --check tools/bootstrap-inbound.mjs
          node --check infra/worker/index.js
          node --check tools/ci-lead-tests.mjs
          node --check tools/ci-intake-tests.mjs
      - name: Lead pipeline unit tests
        run: node tools/ci-lead-tests.mjs --local
      - name: Intake and customer-flow tests
        run: node tools/ci-intake-tests.mjs --local
      - name: Sweep planner dry run
        env:
          OFFER_ID: metro-detroit-auto-repair
        run: node agent/sweep.mjs --dry-run --territories 2
      - name: Smoke-test weekly Excel export
        run: |
          node agent/export-weekly-leads.mjs --dry-run
          python3 - <<'PY'
          import glob, zipfile
          files = glob.glob('artifacts/weekly-auto-shop-leads-*.xlsx')
          assert len(files) == 1, files
          with zipfile.ZipFile(files[0]) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              required = {
                  '[Content_Types].xml',
                  '_rels/.rels',
                  'xl/workbook.xml',
                  'xl/_rels/workbook.xml.rels',
                  'xl/styles.xml',
                  'xl/worksheets/sheet1.xml',
              }
              assert required <= names
          print('weekly xlsx smoke test passed')
          PY
