name: resend-current-weekly-report

on:
  push:
    paths:
      - '.github/resend-current-weekly-report.trigger'

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OFFER_ID: metro-detroit-auto-repair
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
      RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM:             ${{ secrets.MAIL_FROM }}
      INCLUDE_BACKLOG:       'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent dependencies
        working-directory: agent
        run: npm ci --omit=dev
      - name: Rebuild current weekly Excel and email operator
        run: node agent/export-weekly-leads.mjs
