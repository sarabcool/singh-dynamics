name: deploy-khalsa-preview

# Khalsa Computers is a hand-reviewed pilot with its own bespoke renderer.
# Keep preview deploys deterministic and separate from lead enrichment / AI use.
on:
  push:
    branches: [main]
    paths:
      - 'sites/build_khalsa.py'
      - 'sites/shops/khalsa-computers.json'
      - '.github/workflows/deploy-khalsa-preview.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'sites/build_khalsa.py'
      - 'sites/shops/khalsa-computers.json'
      - '.github/workflows/deploy-khalsa-preview.yml'
  workflow_dispatch:

concurrency:
  group: deploy-khalsa-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build private preview
        run: |
          python3 sites/build_khalsa.py --preview
          grep -q 'meta name="robots" content="noindex,nofollow"' sites/dist/khalsa-computers/index.html
          grep -q 'Computers, fixed. Systems, built.' sites/dist/khalsa-computers/index.html

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy sites/dist \
            --project-name=sarabcool-singh-dynamics-previews \
            --branch=main \
            --commit-hash=${{ github.sha }}
