name: deploy-khalsa-preview

# Khalsa Computers is a hand-reviewed pilot with its own bespoke renderer.
# This workflow intentionally avoids marketplace actions so it can still run
# when GitHub's action-download service is degraded.
on:
  push:
    branches: [main]
    paths:
      - 'sites/build_khalsa.py'
      - 'sites/shops/khalsa-computers.json'
      - '.github/workflows/deploy-khalsa-preview.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'sites/build_khalsa.py'
      - 'sites/shops/khalsa-computers.json'
      - '.github/workflows/deploy-khalsa-preview.yml'
  workflow_dispatch:

concurrency:
  group: deploy-khalsa-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch repository without checkout action
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" repo

      - name: Build private preview
        working-directory: repo
        run: |
          python3 sites/build_khalsa.py --preview
          grep -q 'meta name="robots" content="noindex,nofollow"' sites/dist/khalsa-computers/index.html
          grep -q 'Computers, fixed. Systems, built.' sites/dist/khalsa-computers/index.html
          node --version
          npm --version

      - name: Deploy preview to Cloudflare Pages
        working-directory: repo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest pages deploy sites/dist \
            --project-name=sarabcool-singh-dynamics-previews \
            --branch=main
