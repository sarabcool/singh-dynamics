name: apply-migrations

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Migration file under infra/migrations'
        required: true
        default: '004-inquiries.sql'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate migration path
        run: |
          case "${{ github.event.inputs.file }}" in
            [0-9][0-9][0-9]-*.sql) ;;
            *) echo "invalid migration filename"; exit 1 ;;
          esac
          test -f "infra/migrations/${{ github.event.inputs.file }}"
      - name: Apply migration to D1
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
        run: |
          npx --yes wrangler@latest d1 execute "$D1_DATABASE_ID" \
            --remote \
            --file="infra/migrations/${{ github.event.inputs.file }}"
