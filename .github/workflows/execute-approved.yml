name: execute-approved

# The only workflow in this repo that contacts a stranger. It has no schedule
# trigger and must never gain one: every send starts with a human approval.
on:
  repository_dispatch:
    types: [execute-approved]
  workflow_dispatch:
    inputs:
      ids:
        description: 'JSON array of approval_queue ids, e.g. [12,13]'
        required: true
      dry_run:
        description: 'Print what would happen, claim nothing, send nothing'
        type: boolean
        default: true

concurrency:
  group: execute-approved
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute approved actions
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
          RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          WORKER_URL:            ${{ vars.WORKER_URL }}
          MAIL_FROM:             ${{ vars.MAIL_FROM }}
          POSTAL_ADDRESS:        ${{ vars.POSTAL_ADDRESS }}
          # Empty until reply.singhdynamics.com is configured. The executor
          # falls back to the normal Singh Dynamics inbox when unset.
          INBOUND_REPLY_DOMAIN:  ${{ vars.INBOUND_REPLY_DOMAIN }}
          MAX_SENDS:             '25'
          APPROVED_IDS:          ${{ github.event.client_payload.ids && toJson(github.event.client_payload.ids) || github.event.inputs.ids }}
          GITHUB_RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node agent/execute-approved.mjs --dry-run
          else
            node agent/execute-approved.mjs
          fi
