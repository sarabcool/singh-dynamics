name: places-sweep

# Weekly discovery for the active website offer. The offer definition, including
# vertical, search terms and geography, lives in agent/config/offer.mjs so a
# manual workflow run cannot silently use a different targeting strategy.
on:
  repository_dispatch:
    types: [places-sweep]
  # schedule:
    # - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      offer_id:
        description: 'Which offer to sweep. One vertical per run keeps Places spend predictable.'
        type: choice
        default: 'metro-detroit-auto-repair'
        options:
          - metro-detroit-auto-repair
          - metro-detroit-hvac
          - metro-detroit-plumbing
          - metro-detroit-landscaping
      full:
        description: 'Sweep every configured town, not just the core set. Use sparingly.'
        type: boolean
        default: false
      max_searches:
        description: 'Hard ceiling on billable Google Places Text Search calls'
        default: '40'
      classify:
        description: 'Run the Claude storefront pass after sweeping'
        type: boolean
        default: true
      max_cost_cents:
        description: 'Hard ceiling on Anthropic spend for the classify step'
        default: '100'

concurrency:
  group: places-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: agent
        run: npm install --no-audit --no-fund
      - name: Sweep Google Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
          MAX_SEARCHES:          ${{ github.event.inputs.max_searches || '40' }}
          OFFER_ID:              ${{ github.event.inputs.offer_id || 'metro-detroit-auto-repair' }}
          GITHUB_RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/sweep.mjs ${{ github.event.inputs.full == 'true' && '--full' || '' }}
      - name: Classify storefront vs residence
        if: ${{ github.event.inputs.classify != 'false' }}
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
          MAX_COST_CENTS:        ${{ github.event.inputs.max_cost_cents || '100' }}
          OFFER_ID:              ${{ github.event.inputs.offer_id || 'metro-detroit-auto-repair' }}
          GITHUB_RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/classify.mjs
