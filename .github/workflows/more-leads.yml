name: more-leads

# On-demand version of the Sunday pipeline, for when the week's leads are used
# up before the week is. Manual only: there is no schedule here on purpose, so
# this can never double the Google Places bill by running on its own.
#
# It advances into the next territory the rotation has not worked yet rather
# than re-searching towns the weekly job already exhausted. Qualification rules
# are identical to the weekly run. Nothing is sent to a prospect: the only email
# this workflow produces is the internal Excel report to the operator inbox.
on:
  workflow_dispatch:
    inputs:
      territories:
        description: 'How many territories to work in this run (1-3). Each is roughly 40-70 Places requests.'
        default: '1'
      territory:
        description: 'Optional: force one territory key (e.g. macomb-south). Leave blank to let the rotation choose.'
        default: ''
      max_searches:
        description: 'Hard ceiling on Google Places requests for this run'
        default: '80'
      include_backlog:
        description: 'Include older qualified leads in the Excel, not just this run'
        type: boolean
        default: false
      window_days:
        description: 'How many days of leads the Excel covers when backlog is off'
        default: '14'

concurrency:
  # Shares a group with the weekly job. Two sweeps at once would race on
  # territory_state and spend twice as much for the same ground.
  group: auto-leads-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  more-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OFFER_ID: metro-detroit-auto-repair
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
      GITHUB_RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci --omit=dev

      - name: Sweep the next unused territory
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          MAX_SEARCHES: ${{ github.event.inputs.max_searches || '80' }}
          TERRITORY_COUNT: ${{ github.event.inputs.territories || '1' }}
          TERRITORY: ${{ github.event.inputs.territory }}
        run: node agent/sweep.mjs

      - name: Qualify independent storefront auto shops
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_COST_CENTS: '100'
        run: node agent/classify.mjs

      - name: Re-check website and look for an email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_LEADS: '12'
          MAX_COST_CENTS: '75'
          INCLUDE_BACKLOG: ${{ github.event.inputs.include_backlog || 'false' }}
        run: node agent/research-weekly-leads.mjs

      - name: Create Excel and email it to the operator inbox
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          OPERATOR_TO: ${{ secrets.OPERATOR_TO }}
          INCLUDE_BACKLOG: ${{ github.event.inputs.include_backlog || 'false' }}
          EXPORT_WINDOW_DAYS: ${{ github.event.inputs.window_days || '14' }}
          EXPORT_LABEL: on-demand
        run: node agent/export-weekly-leads.mjs
