name: bootstrap-inbound

# One-time/re-runnable setup for automated reply ingestion.
# Run only after this PR is merged and deploy-worker has successfully deployed
# the /webhooks/resend endpoint. The script is idempotent and refuses to replace
# a conflicting MX record.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Run this workflow from main after the backend PR is merged."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check deployed Worker health
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$WORKER_URL"
          curl --fail --silent --show-error "${WORKER_URL%/}/health" >/dev/null

      - name: Apply safe inbound migrations
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest d1 execute singh-dynamics --remote --yes \
            --config infra/worker/wrangler.toml --file=infra/migrations/004-inquiries.sql
          npx --yes wrangler@latest d1 execute singh-dynamics --remote --yes \
            --config infra/worker/wrangler.toml --file=infra/migrations/005-inbound-email.sql

      - name: Configure receiving domain, DNS and webhook
        env:
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL:             ${{ vars.WORKER_URL }}
          ROOT_DOMAIN:            singhdynamics.com
          INBOUND_DOMAIN:         reply.singhdynamics.com
        run: node tools/bootstrap-inbound.mjs

      - name: Install webhook signing secret on Worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -s "$RUNNER_TEMP/resend-webhook-secret"
          npx --yes wrangler@latest secret put RESEND_WEBHOOK_SECRET \
            --name singh-dynamics \
            --config infra/worker/wrangler.toml \
            < "$RUNNER_TEMP/resend-webhook-secret"
          rm -f "$RUNNER_TEMP/resend-webhook-secret"

      - name: Enable lead-specific reply routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --output /tmp/inbound-var --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/INBOUND_REPLY_DOMAIN")

          if [ "$code" = "200" ]; then
            curl --fail --silent --show-error -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/INBOUND_REPLY_DOMAIN" \
              -d '{"name":"INBOUND_REPLY_DOMAIN","value":"reply.singhdynamics.com"}' >/dev/null
          elif [ "$code" = "404" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables" \
              -d '{"name":"INBOUND_REPLY_DOMAIN","value":"reply.singhdynamics.com"}' >/dev/null
          else
            cat /tmp/inbound-var
            echo "Could not read INBOUND_REPLY_DOMAIN variable (HTTP $code)."
            exit 1
          fi

      - name: Verify resulting configuration
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest secret list \
            --name singh-dynamics \
            --config infra/worker/wrangler.toml \
            | grep -q 'RESEND_WEBHOOK_SECRET'
          echo "Inbound automation bootstrap complete. DNS verification may still take time before mail starts arriving."
